[project]
name = "ims"
version = "0.1.0"
description = "FastAPI microservice for a thrift shop inventory, sales, payments, and analytics."
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.114.2",
    "SQLAlchemy==2.0.29",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.12",
    "pydantic>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "python-jose[cryptography]==3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==8.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
