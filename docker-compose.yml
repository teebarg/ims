services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - node_cache:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "51730:5173"
    networks:
      - dev-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-net
      - traefik.http.services.ims.loadbalancer.server.port=5173
      - traefik.http.routers.ims.rule=Host(`ims.localhost`)
      - traefik.http.routers.ims.entrypoints=https
      - traefik.http.routers.ims.tls=true
      - traefik.http.routers.ims-http.rule=Host(`ims.localhost`)
      - traefik.http.routers.ims-http.entrypoints=http
      - traefik.http.routers.ims-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-net
      - traefik.http.services.ims-api.loadbalancer.server.port=8000
      - traefik.http.routers.ims-api.rule=Host(`api.ims.localhost`)
      - traefik.http.routers.ims-api.entrypoints=https
      - traefik.http.routers.ims-api.tls=true
      - traefik.http.routers.ims-api-http.rule=Host(`api.ims.localhost`)
      - traefik.http.routers.ims-api-http.entrypoints=http
      - traefik.http.routers.ims-api-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    ports:
      - "80000:8000"
    networks:
      - dev-net
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_uv_cache:/root/.cache/uv
    platform: linux/amd64
    environment:
      - UV_HTTP_TIMEOUT=60
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  dev-net:
    external: true

volumes:
  backend_uv_cache:
  backend_venv:
  node_cache: